# Android cross-compile build for the Frostrig RandomX algorithm modules.
#
# Triggers:
#   - manually from the Actions "Run workflow" UI (workflow_dispatch)
#     with an "architecture" input: aarch64 (ARMv8) or armv7 (ARMv7-A, 32-bit)
#
# What this job produces
# ----------------------
# A single dynamically-linked shared library  libfrostrig-randomx-<arch>.so
# that bundles the 6 RandomX variant C modules (rx/0, rx/wow, rx/2, rx/c64,
# rx/v, rx/xeq) together with the RandomX core, and can be dropped into
# Termux (or proot) on an Android device of the matching architecture.
#
#   - Termux:  /data/data/com.termux/files/usr/lib/libfrostrig-randomx-aarch64.so
#     (NDK libraries resolve against the Termux package manager's
#     libstdc++/libm/libc when installed into the bionic root)
#   - proot:    the same .so works under proot with a Linux chroot; run
#     `patchelf --set-rpath $ORIGIN` if you want the library to find its
#     own NEEDED entries relative to its own location.
#
# The RandomX core is cross-compiled from source (the vendored
# third_party/ directory is gitignored, so CI must fetch it) and linked
# as a shared library so that libstdc++ and the bionic C library resolve
# at load time on the device instead of being statically baked in.
#
# errhandler.odin is part of the Odin host program only; it is not
# included in this C-only cross-compile job.

name: android-build

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: "Android CPU architecture to cross-compile for"
        type: choice
        required: true
        default: aarch64
        options:
          - aarch64
          - armv7
  push:
    branches:
      - '261108-feat-frostrig-skeleton'

permissions:
  contents: read

jobs:
  build:
    name: android / ${{ inputs.architecture }}
    runs-on: ubuntu-latest

    env:
      NDK_VERSION: "r25c"
      ANDROID_ARCH: ${{ inputs.architecture }}
      NDK_TRIPLE: >-
        ${{
          inputs.architecture == 'aarch64'
            && 'aarch64-linux-android33'
            || 'armv7a-linux-androideabi29'
        }}
      ANDROID_PLATFORM: >-
        ${{ inputs.architecture == 'aarch64' && '33' || '29' }}
      # CMake ANDROID_ABI values differ from our input names
      ANDROID_CMAKE_ABI: >-
        ${{
          inputs.architecture == 'aarch64'
            && 'arm64-v8a'
            || 'armeabi-v7a'
        }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------------
      - name: Download Android NDK ${{ env.NDK_VERSION }}
        run: |
          set -euo pipefail
          curl -sSL -o ndk.zip \
            "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          mkdir -p toolchain
          unzip -q ndk.zip -d toolchain
          NDK_ROOT="$(pwd)/toolchain/$(ls toolchain | grep android-ndk)"
          echo "NDK_ROOT=${NDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "${GITHUB_PATH}"

      # ------------------------------------------------------------------
      # RandomX core, cross-compiled from source
      # ------------------------------------------------------------------
      - name: Fetch RandomX source
        run: |
          set -euo pipefail
          # RandomX v1.2.3 is the last v1.x release whose C API matches
          # third_party/randomx/include/randomx.h (v2.x has a different layout).
          # third_party/ is gitignored so CI must fetch source.
          curl -fSL --retry 3 -o randomx.tar.gz \
            "https://github.com/tevador/RandomX/archive/refs/tags/v1.2.3.tar.gz"
          tar -tzf randomx.tar.gz >/dev/null  # fail early if not a valid gzip
          rm -rf randomx_src
          # tarball top-level dir is RandomX-1.2.3 (tag without the v prefix)
          tar -xzf randomx.tar.gz
          mv "$(tar -tzf randomx.tar.gz | head -n 1 | cut -d/ -f1)" randomx_src
          echo "RandomX source at randomx_src/"; ls randomx_src/src/ | head

      # Keva variant: copy the RandomX tree, apply the configuration.h diff
      # (salt, scratchpad sizes, _KEVACOIN flag) and rebuild.
      - name: Build RandomX-Keva tree
        run: |
          set -euo pipefail
          cp -r randomx_src randomx_keva_src
          cat > randomx_keva_src/src/configuration.h <<'EOF'
          #pragma once

          #define _KEVACOIN    1

          //Cache size in KiB. Must be a power of 2.
          #define RANDOMX_ARGON_MEMORY       262144

          //Number of Argon2d iterations for Cache initialization.
          #define RANDOMX_ARGON_ITERATIONS   3

          //Number of parallel lanes for Cache initialization.
          #define RANDOMX_ARGON_LANES        1

          //Argon2d salt
          #ifdef _KEVACOIN
          #define RANDOMX_ARGON_SALT         "RandomKV\x01"
          #else
          #define RANDOMX_ARGON_SALT         "RandomX\x03"
          #endif

          //Number of random Cache accesses per Dataset item. Minimum is 2.
          #define RANDOMX_CACHE_ACCESSES     8

          //Target latency for SuperscalarHash (in cycles of the reference CPU).
          #define RANDOMX_SUPERSCALAR_LATENCY   170

          //Dataset base size in bytes. Must be a power of 2.
          #define RANDOMX_DATASET_BASE_SIZE  2147483648

          //Dataset extra size. Must be divisible by 64.
          #define RANDOMX_DATASET_EXTRA_SIZE 33554368

          //Number of instructions in a RandomX program. Must be divisible by 8.
          #define RANDOMX_PROGRAM_SIZE       256

          //Number of iterations during VM execution.
          #define RANDOMX_PROGRAM_ITERATIONS 2048

          //Number of chained VM executions per hash.
          #define RANDOMX_PROGRAM_COUNT      8

          //Scratchpad L3 size in bytes. Must be a power of 2.
          #ifdef _KEVACOIN
          #define RANDOMX_SCRATCHPAD_L3      1048576
          #else
          #define RANDOMX_SCRATCHPAD_L3      2097152
          #endif

          //Scratchpad L2 size in bytes. Must be a power of two and less than or equal to RANDOMX_SCRATCHPAD_L3.
          #ifdef _KEVACOIN
          #define RANDOMX_SCRATCHPAD_L2      131072
          #else
          #define RANDOMX_SCRATCHPAD_L2      262144
          #endif

          //Scratchpad L1 size in bytes. Must be a power of two (minimum 64) and less than or equal to RANDOMX_SCRATCHPAD_L2.
          #define RANDOMX_SCRATCHPAD_L1      16384

          //Jump condition mask size in bits.
          #define RANDOMX_JUMP_BITS          8

          //Jump condition mask offset in bits. The sum of RANDOMX_JUMP_BITS and RANDOMX_JUMP_OFFSET must not exceed 16.
          #define RANDOMX_JUMP_OFFSET        8

          /*
          Instruction frequencies (per 256 opcodes)
          Total sum of frequencies must be 256
          */

          //Integer instructions
          #define RANDOMX_FREQ_IADD_RS       16
          #define RANDOMX_FREQ_IADD_M         7
          #define RANDOMX_FREQ_ISUB_R        16
          #define RANDOMX_FREQ_ISUB_M         7
          #define RANDOMX_FREQ_IMUL_R        16
          #define RANDOMX_FREQ_IMUL_M         4
          #define RANDOMX_FREQ_IMULH_R        4
          #define RANDOMX_FREQ_IMULH_M        1
          #define RANDOMX_FREQ_ISMULH_R       4
          #define RANDOMX_FREQ_ISMULH_M       1
          #define RANDOMX_FREQ_IMUL_RCP       8
          #define RANDOMX_FREQ_INEG_R         2
          #define RANDOMX_FREQ_IXOR_R        15
          #define RANDOMX_FREQ_IXOR_M         5
          #define RANDOMX_FREQ_IROR_R         8
          #define RANDOMX_FREQ_IROL_R         2
          #define RANDOMX_FREQ_ISWAP_R        4

          //Floating point instructions
          #define RANDOMX_FREQ_FSWAP_R        4
          #define RANDOMX_FREQ_FADD_R        16
          #define RANDOMX_FREQ_FADD_M         5
          #define RANDOMX_FREQ_FSUB_R        16
          #define RANDOMX_FREQ_FSUB_M         5
          #define RANDOMX_FREQ_FSCAL_R        6
          #define RANDOMX_FREQ_FMUL_R        32
          #define RANDOMX_FREQ_FDIV_M         4
          #define RANDOMX_FREQ_FSQRT_R        6

          //Control instructions
          #define RANDOMX_FREQ_CBRANCH       25
          #define RANDOMX_FREQ_CFROUND        1

          //Store instruction
          #define RANDOMX_FREQ_ISTORE        16

          //No-op instruction
          #define RANDOMX_FREQ_NOP            0
          EOF
          echo "Keva tree ready at randomx_keva_src/"

      - name: Cross-compile RandomX static lib via CMake
        run: |
          set -euo pipefail
          cmake -S randomx_src -B randomx_src/build \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_CMAKE_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          # Build only the 'randomx' target; the CMakeLists also defines test
          # executables that cannot be built cross-arch.
          cmake --build randomx_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_src/build/librandomx.a

      - name: Cross-compile RandomX-Keva static lib via CMake
        run: |
          set -euo pipefail
          cmake -S randomx_keva_src -B randomx_keva_src/build \
            -DCMAKE_TOOLCHAIN_FILE="${NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="${ANDROID_CMAKE_ABI}" \
            -DANDROID_PLATFORM="${ANDROID_PLATFORM}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build randomx_keva_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_keva_src/build/librandomx.a

      # ------------------------------------------------------------------
      # Link the 7 frostrig variant modules + both RandomX libs into a
      # single shared library deliverable (one .so to drop into Termux).
      # ------------------------------------------------------------------
       - name: Link all variant modules into libfrostrig-randomx.so
         run: |
           set -euo pipefail
           CC="${NDK_TRIPLE}-clang"
           CXX="${NDK_TRIPLE}-clang++"
           mkdir -p build

           # Version script: export frostrig_* symbols so --gc-sections
           # does not strip them.
           cat > /tmp/frostrig.exports <<'EOF'
           FROSTRIG_RANDOMX_1.0 {
             global:
               frostrig_*;
             local:
               *;
           };
           EOF

           "${CXX}" -O2 -fPIC -fvisibility=default -shared \
             -Ialgo/randomx -Ialgo/keva \
             -Irandomx_src/src -Irandomx_keva_src/src \
             algo/randomx/0.c \
             algo/randomx/wow.c \
             algo/randomx/2.c \
             algo/randomx/c64.c \
             algo/randomx/v.c \
             algo/randomx/xeq.c \
             algo/keva/keva.c \
             randomx_src/build/librandomx.a \
             randomx_keva_src/build/librandomx.a \
             -lstdc++ -lm \
             -Wl,--gc-sections \
             -Wl,--version-script,/tmp/frostrig.exports \
             -o "build/libfrostrig-randomx-${ANDROID_ARCH}.so"
           ls -lh "build/libfrostrig-randomx-${ANDROID_ARCH}.so"

      # ------------------------------------------------------------------
      # Verify the artefact is a valid ELF for the target architecture and
      # that all 6 variant prefixes are exported.
      # ------------------------------------------------------------------
      - name: Verify exported symbols
        run: |
          set -euo pipefail
          LIB="build/libfrostrig-randomx-${ANDROID_ARCH}.so"
          readelf -h "${LIB}"
          readelf -d "${LIB}" | grep NEEDED || true
          for sym in \
            frostrig_rx0_create frostrig_rx_wow_create \
            frostrig_rx2_create frostrig_rx_c64_create \
            frostrig_rx_v_create frostrig_rx_xeq_create \
            frostrig_rx_keva_create; do
            readelf -W --dyn-syms "${LIB}" | grep -E " T ${sym}$" \
              || { echo "missing symbol ${sym} in ${LIB}"; exit 1; }
          done
          echo "All 7 variant prefixes exported."

      # ------------------------------------------------------------------
      # Upload the single deliverable .so
      # ------------------------------------------------------------------
      - name: Package artefact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/libfrostrig-randomx-${ANDROID_ARCH}.so" dist/
          ls -lh dist/

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: frostrig-android-${{ inputs.architecture }}
          path: dist/
          retention-days: 3
