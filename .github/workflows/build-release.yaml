# Release build for the Frostrig Odin project.
#
# Triggers:
#   - git tag matching  rv<major>.<minor>.<patch>[suffix]
#       e.g. rv1.0.0, rv2.3.1, rv1.4.2-beta
#   - manually from the Actions "Run workflow" UI (workflow_dispatch)
#
# Builds both Windows and Linux, release and debug.
# The CPU architecture is taken from the "architecture" workflow input
# (manual trigger) or defaults to amd64 when triggered by a tag.
#
# errhandler.odin is committed to the repo root and is compiled into every
# build.  Its @(init) proc opens "errhandler.log" in the current working
# directory at startup, so panics are written there in both debug and
# release builds.

name: build-release

on:
  push:
    tags:
      # rv<semver> with an optional trailing suffix (e.g. -beta, +rc1)
      - 'rv[0-9]+.[0-9]+.[0-9]+'
      - 'rv[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      architecture:
        description: "CPU architecture to build for"
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64
          - i386

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: >-
      ${{ matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        mode: [release, debug]
        # arch is the single architecture selected via workflow_dispatch
        # input, or amd64 when triggered by a tag.
        arch:
          - ${{ github.event.inputs.architecture || 'amd64' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Odin toolchain
      #   odin-lang/setup-odin action is not available on GitHub Marketplace;
      #   download the nightly binary directly instead.
      # ------------------------------------------------------------------
      - name: Install Odin
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            curl -fSL --retry 3 -o odin.tar.gz \
              "https://github.com/odin-lang/Odin/releases/download/dev-2026-11/odin-linux-amd64-dev-2026-11.tar.gz"
            tar xzf odin.tar.gz -C .
            ODIR="$(ls -d odin-* | head -n 1)"
            echo "ODIN_DIR=${PWD}/${ODIR}" >> "${GITHUB_ENV}"
            "${PWD}/${ODIR}/odin" version
          else
            curl -fSL --retry 3 -o odin.zip \
              "https://github.com/odin-lang/Odin/releases/download/dev-2026-11/odin-windows-amd64-dev-2026-11.zip"
            # PowerShell Expand-Archive is very slow for large zips.
            # Use 7z if available, otherwise fall back to PowerShell.
            if command -v 7z &>/dev/null; then
              7z x -y odin.zip -o"odin-pkg"
            else
              powershell -Command "Expand-Archive -Force -Path odin.zip -DestinationPath .\odin-pkg"
            fi
            # Zip extracts to odin-pkg/dist/ (odin.exe inside) or odin-pkg/odin-windows-amd64-*/
            if [ -d "odin-pkg/dist" ] && [ -f "odin-pkg/dist/odin.exe" ]; then
              ODIR="odin-pkg/dist"
            elif [ -f "odin-pkg/odin.exe" ]; then
              ODIR="odin-pkg"
            else
              ODIR="$(find odin-pkg -type f -name odin.exe 2>/dev/null | head -n1 | xargs dirname)"
            fi
            echo "ODIN_DIR=${PWD}/${ODIR}" >> "${GITHUB_ENV}"
            echo "${PWD}/${ODIR}" >> "${GITHUB_PATH}"
            echo "${PWD}/${ODIR}/bin" >> "${GITHUB_PATH}"
            echo "--- Odin directory: ${ODIR}"
            ls -la "${ODIR}"
             "${ODIR}/odin.exe" version
          fi

      - name: Install LLVM backend (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld

      # ------------------------------------------------------------------
      # errhandler is committed to the repo root (errhandler.odin) and is
      # compiled into every build automatically by `odin build .`.  Its
      # @(init) proc opens "errhandler.log" in the current directory at
      # startup, so any panic traceback is written there.  No CI step is
      # needed to install it.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # RandomX + Keva static libs
      #   RandomX and RandomX-Keva are built from source via CMake.
      #   Linux:  build/librandomx.a
      #   Windows: build/Release/randomx.lib
      # ------------------------------------------------------------------
      - name: Fetch RandomX source
        shell: bash
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o randomx.tar.gz \
            "https://github.com/tevador/RandomX/archive/refs/tags/v1.2.3.tar.gz"
          tar -xzf randomx.tar.gz
          mv "$(tar -tzf randomx.tar.gz | head -n 1 | cut -d/ -f1)" randomx_src
          echo "RandomX source at randomx_src/"

      - name: Build RandomX static lib
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S randomx_src -B randomx_src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build randomx_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_src/build/librandomx.a

      - name: Build RandomX static lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Use MinGW-w64 (pre-installed on GitHub runners) for POSIX-compatible .a output
          # that lld-link handles natively, avoiding MSVC UCRT import lib issues.
          MINGW_BIN="/c/mingw64/bin"
          export PATH="${MINGW_BIN}:${PATH}"
          echo "MinGW on PATH: $(which x86_64-w64-mingw32-g++)"
          cat > mingw64.cmake <<'CMEOF'
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_MAKE_PROGRAM mingw32-make)
          set(CMAKE_C_FLAGS "-O2")
          set(CMAKE_CXX_FLAGS "-O2")
          set(CMAKE_FIND_ROOT_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_MODE_INCLUDE ONLY)
          CMEOF
          cmake -G "MinGW Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/mingw64.cmake" \
            -DCMAKE_MAKE_PROGRAM="$(which mingw32-make)" \
            -DCMAKE_C_COMPILER="$(which x86_64-w64-mingw32-gcc)" \
            -DCMAKE_CXX_COMPILER="$(which x86_64-w64-mingw32-g++)" \
            -DCMAKE_BUILD_TYPE=Release \
            -S randomx_src -B randomx_src/build
          cmake --build randomx_src/build --target randomx -j 8
          ls -lh randomx_src/build/librandomx.a

      - name: Build RandomX-Keva static lib
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp -r randomx_src randomx_keva_src
          rm -rf randomx_keva_src/build
          cat > randomx_keva_src/src/configuration.h <<'EOF'
          #pragma once
          #define _KEVACOIN    1
          #define RANDOMX_ARGON_MEMORY       262144
          #define RANDOMX_ARGON_ITERATIONS   3
          #define RANDOMX_ARGON_LANES        1
          #define RANDOMX_ARGON_SALT         "RandomKV\x01"
          #define RANDOMX_CACHE_ACCESSES     8
          #define RANDOMX_SUPERSCALAR_LATENCY   170
          #define RANDOMX_DATASET_BASE_SIZE  2147483648
          #define RANDOMX_DATASET_EXTRA_SIZE 33554368
          #define RANDOMX_PROGRAM_SIZE       256
          #define RANDOMX_PROGRAM_ITERATIONS 2048
          #define RANDOMX_PROGRAM_COUNT      8
          #define RANDOMX_SCRATCHPAD_L3      1048576
          #define RANDOMX_SCRATCHPAD_L2      131072
          #define RANDOMX_SCRATCHPAD_L1      16384
          #define RANDOMX_JUMP_BITS          8
          #define RANDOMX_JUMP_OFFSET        8
          #define RANDOMX_FREQ_IADD_RS       16
          #define RANDOMX_FREQ_IADD_M         7
          #define RANDOMX_FREQ_ISUB_R        16
          #define RANDOMX_FREQ_ISUB_M         7
          #define RANDOMX_FREQ_IMUL_R        16
          #define RANDOMX_FREQ_IMUL_M         4
          #define RANDOMX_FREQ_IMULH_R        4
          #define RANDOMX_FREQ_IMULH_M        1
          #define RANDOMX_FREQ_ISMULH_R       4
          #define RANDOMX_FREQ_ISMULH_M       1
          #define RANDOMX_FREQ_IMUL_RCP       8
          #define RANDOMX_FREQ_INEG_R         2
          #define RANDOMX_FREQ_IXOR_R        15
          #define RANDOMX_FREQ_IXOR_M         5
          #define RANDOMX_FREQ_IROR_R         8
          #define RANDOMX_FREQ_IROL_R         2
          #define RANDOMX_FREQ_ISWAP_R        4
          #define RANDOMX_FREQ_FSWAP_R        4
          #define RANDOMX_FREQ_FADD_R        16
          #define RANDOMX_FREQ_FADD_M         5
          #define RANDOMX_FREQ_FSUB_R        16
          #define RANDOMX_FREQ_FSUB_M         5
          #define RANDOMX_FREQ_FSCAL_R        6
          #define RANDOMX_FREQ_FMUL_R        32
          #define RANDOMX_FREQ_FDIV_M         4
          #define RANDOMX_FREQ_FSQRT_R        6
          #define RANDOMX_FREQ_CBRANCH       25
          #define RANDOMX_FREQ_CFROUND        1
          #define RANDOMX_FREQ_ISTORE        16
          #define RANDOMX_FREQ_NOP            0
          EOF
          cmake -S randomx_keva_src -B randomx_keva_src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build randomx_keva_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_keva_src/build/librandomx.a

      - name: Build RandomX-Keva static lib (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cp -r randomx_src randomx_keva_src
          rm -rf randomx_keva_src/build
          cat > randomx_keva_src/src/configuration.h <<'EOF'
          #pragma once
          #define _KEVACOIN    1
          #define RANDOMX_ARGON_MEMORY       262144
          #define RANDOMX_ARGON_ITERATIONS   3
          #define RANDOMX_ARGON_LANES        1
          #define RANDOMX_ARGON_SALT         "RandomKV\x01"
          #define RANDOMX_CACHE_ACCESSES     8
          #define RANDOMX_SUPERSCALAR_LATENCY   170
          #define RANDOMX_DATASET_BASE_SIZE  2147483648
          #define RANDOMX_DATASET_EXTRA_SIZE 33554368
          #define RANDOMX_PROGRAM_SIZE       256
          #define RANDOMX_PROGRAM_ITERATIONS 2048
          #define RANDOMX_PROGRAM_COUNT      8
          #define RANDOMX_SCRATCHPAD_L3      1048576
          #define RANDOMX_SCRATCHPAD_L2      131072
          #define RANDOMX_SCRATCHPAD_L1      16384
          #define RANDOMX_JUMP_BITS          8
          #define RANDOMX_JUMP_OFFSET        8
          #define RANDOMX_FREQ_IADD_RS       16
          #define RANDOMX_FREQ_IADD_M         7
          #define RANDOMX_FREQ_ISUB_R        16
          #define RANDOMX_FREQ_ISUB_M         7
          #define RANDOMX_FREQ_IMUL_R        16
          #define RANDOMX_FREQ_IMUL_M         4
          #define RANDOMX_FREQ_IMULH_R        4
          #define RANDOMX_FREQ_IMULH_M        1
          #define RANDOMX_FREQ_ISMULH_R       4
          #define RANDOMX_FREQ_ISMULH_M       1
          #define RANDOMX_FREQ_IMUL_RCP       8
          #define RANDOMX_FREQ_INEG_R         2
          #define RANDOMX_FREQ_IXOR_R        15
          #define RANDOMX_FREQ_IXOR_M         5
          #define RANDOMX_FREQ_IROR_R         8
          #define RANDOMX_FREQ_IROL_R         2
          #define RANDOMX_FREQ_ISWAP_R        4
          #define RANDOMX_FREQ_FSWAP_R        4
          #define RANDOMX_FREQ_FADD_R        16
          #define RANDOMX_FREQ_FADD_M         5
          #define RANDOMX_FREQ_FSUB_R        16
          #define RANDOMX_FREQ_FSUB_M         5
          #define RANDOMX_FREQ_FSCAL_R        6
          #define RANDOMX_FREQ_FMUL_R        32
          #define RANDOMX_FREQ_FDIV_M         4
          #define RANDOMX_FREQ_FSQRT_R        6
          #define RANDOMX_FREQ_CBRANCH       25
          #define RANDOMX_FREQ_CFROUND        1
          #define RANDOMX_FREQ_ISTORE        16
          #define RANDOMX_FREQ_NOP            0
          EOF
          MINGW_BIN="/c/mingw64/bin"
          export PATH="${MINGW_BIN}:${PATH}"
          echo "MinGW compiler: $(which x86_64-w64-mingw32-gcc)"
          echo "MinGW make: $(which mingw32-make)"
          ls -lh "$(pwd)/mingw64.cmake"
          cmake -G "MinGW Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/mingw64.cmake" \
            -DCMAKE_MAKE_PROGRAM="$(which mingw32-make)" \
            -DCMAKE_C_COMPILER="$(which x86_64-w64-mingw32-gcc)" \
            -DCMAKE_CXX_COMPILER="$(which x86_64-w64-mingw32-g++)" \
            -DCMAKE_BUILD_TYPE=Release \
            -S randomx_keva_src -B randomx_keva_src/build
          echo "Keva CMake configure OK"
          cmake --build randomx_keva_src/build --target randomx -j 8
          echo "Keva CMake build OK"
          find randomx_keva_src/build -name '*.a' -o -name '*.lib' 2>/dev/null
          ls -lh randomx_keva_src/build/

      # ------------------------------------------------------------------
      # Link third_party static libs
      #   The third_party/ directory is gitignored; FFI files reference
      #   specific paths like third_party/randomx/lib/linux-x86_64/...
      #   so we must create the directory structure and copy the built
      #   libraries into place before running `odin build`.
      # ------------------------------------------------------------------
      - name: Link third_party static libs (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ARCH="linux-x86_64"
          mkdir -p "third_party/randomx/lib/${ARCH}"
          mkdir -p "third_party/randomx-keva/lib/${ARCH}"
          cp randomx_src/build/librandomx.a "third_party/randomx/lib/${ARCH}/librandomx.a"
          cp randomx_keva_src/build/librandomx.a "third_party/randomx-keva/lib/${ARCH}/librandomx-keva.a"
          echo "third_party libs in place:"
          ls -lh third_party/randomx/lib/${ARCH}/
          ls -lh third_party/randomx-keva/lib/${ARCH}/

      - name: Link third_party static libs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ARCH="windows-x86_64"
          mkdir -p "third_party/randomx/lib/${ARCH}"
          mkdir -p "third_party/randomx-keva/lib/${ARCH}"
          # MinGW produces librandomx.a (POSIX archive); rename to .lib for FFI compat
          cp randomx_src/build/librandomx.a "third_party/randomx/lib/${ARCH}/librandomx.lib"
          cp randomx_keva_src/build/librandomx.a "third_party/randomx-keva/lib/${ARCH}/librandomx-keva.lib"
          echo "third_party libs in place:"
          ls -lh third_party/randomx/lib/${ARCH}/
          ls -lh third_party/randomx-keva/lib/${ARCH}/

      # ------------------------------------------------------------------
      # Compile C algo modules
      #   RandomX / Keva variant wrappers (C)
      #   Argon2 (C library)
      #   VerusHash (C + C++)
      #   The .o / .obj / .lib files are gitignored; CI compiles fresh
      #   objects for the target platform before the Odin build step.
      # ------------------------------------------------------------------
      - name: Compile C algo modules (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail

          # RandomX variant wrappers
          for f in algo/randomx/0.c algo/randomx/wow.c algo/randomx/2.c \
                   algo/randomx/c64.c algo/randomx/v.c algo/randomx/xeq.c \
                   algo/keva/keva.c; do
            O="${f%.c}.o"
            echo "  -> ${O}"
            cc -O2 -fPIC -c -Ialgo/randomx -Ialgo/keva "${f}" -o "${O}"
          done

          # Argon2: combine third_party/argon2/src/*.c + algo/argon2/*.c
          # Remove committed pre-built ELF archives before creating fresh ones.
          rm -f algo/argon2/argon2_all.o algo/verushash/verushash_all.o
          echo "  -> algo/argon2/argon2_all.o"
          mkdir -p /tmp/argon2_objs
          for f in third_party/argon2/src/argon2.c third_party/argon2/src/blake2b.c \
                   third_party/argon2/src/core.c third_party/argon2/src/encoding.c \
                   third_party/argon2/src/opt.c third_party/argon2/src/thread.c; do
            B=$(basename "${f}" .c)
            cc -O2 -fPIC -c -Ithird_party/argon2/include -Ithird_party/argon2/src \
               "${f}" -o "/tmp/argon2_objs/${B}.o"
          done
          cc -O2 -fPIC -c -Ialgo/argon2 -Ithird_party/argon2/include -Ithird_party/argon2/src \
            algo/argon2/argon2_id.c -o /tmp/argon2_objs/argon2_id.o
          cc -O2 -fPIC -c -Ialgo/argon2 -Ithird_party/argon2/include -Ithird_party/argon2/src \
            algo/argon2/argon2d.c -o /tmp/argon2_objs/argon2d.o
          ar rcs algo/argon2/argon2_all.o /tmp/argon2_objs/*.o
          rm -rf /tmp/argon2_objs

          # VerusHash: C + C++ sources
          echo "  -> algo/verushash/verushash_all.o"
          mkdir -p /tmp/vh_objs
          cc -O2 -fPIC -c algo/verushash/haraka_portable.c -o /tmp/vh_objs/haraka.o
          c++ -O2 -fPIC -std=c++11 -c algo/verushash/verushash.cpp -o /tmp/vh_objs/vh.o
          c++ -O2 -fPIC -std=c++11 -c algo/verushash/vh_clhash_portable.cpp -o /tmp/vh_objs/vh_cl.o
          c++ -O2 -fPIC -std=c++11 -c algo/verushash/vh_hash.cpp -o /tmp/vh_objs/vh_h.o
          ar rcs algo/verushash/verushash_all.o /tmp/vh_objs/*.o
          rm -rf /tmp/vh_objs

          echo "C modules compiled"

      - name: Compile C algo modules (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          # Use MinGW-w64 for POSIX-compatible .obj output
          MINGW_BIN="/c/mingw64/bin"
          export PATH="${MINGW_BIN}:${PATH}"
          CC="${MINGW_BIN}/x86_64-w64-mingw32-gcc"
          CXX="${MINGW_BIN}/x86_64-w64-mingw32-g++"
          AR="${MINGW_BIN}/x86_64-w64-mingw32-ar"
          echo "Using MinGW: ${CC}"

          # Remove committed pre-built ELF archives (irrelevant on Windows,
          # but keep the tree clean).
          rm -f algo/argon2/argon2_all.o algo/verushash/verushash_all.o
          rm -f algo/randomx/*.o algo/keva/*.o

          # Compile RandomX variant wrappers (C)
          for f in algo/randomx/0.c algo/randomx/wow.c algo/randomx/2.c algo/randomx/c64.c algo/randomx/v.c algo/randomx/xeq.c; do
            base=$(basename "$f" .c)
            echo "  -- $f"
            "$CC" -O2 -c -Ialgo/randomx -Ialgo/keva "$f" -o "algo/randomx/${base}.obj"
          done
          "$CC" -O2 -c -Ialgo/randomx -Ialgo/keva algo/keva/keva.c -o "algo/keva/keva.obj"

          # Compile Argon2 (C library)
          echo "  -- algo/argon2/argon2_all.lib"
          mkdir -p argon2_objs
          for f in third_party/argon2/src/argon2.c third_party/argon2/src/blake2b.c \
                   third_party/argon2/src/core.c third_party/argon2/src/encoding.c \
                   third_party/argon2/src/opt.c third_party/argon2/src/thread.c; do
            base=$(basename "$f" .c)
            "$CC" -O2 -c -Ialgo/argon2 -Ithird_party/argon2/include -Ithird_party/argon2/src "$f" -o "argon2_objs/${base}.obj"
          done
          "$CC" -O2 -c -Ialgo/argon2 -Ithird_party/argon2/include -Ithird_party/argon2/src algo/argon2/argon2_id.c -o "argon2_objs/argon2_id.obj"
          "$CC" -O2 -c -Ialgo/argon2 -Ithird_party/argon2/include -Ithird_party/argon2/src algo/argon2/argon2d.c -o "argon2_objs/argon2d.obj"
          "$AR" rcs algo/argon2/argon2_all.lib argon2_objs/*.obj
          rm -rf argon2_objs

          # Compile VerusHash (C + C++)
          echo "  -- algo/verushash/verushash_all.lib"
          mkdir -p vh_objs
          "$CC" -O2 -c algo/verushash/haraka_portable.c -o "vh_objs/haraka.obj"
          "$CXX" -O2 -std=c++17 -c algo/verushash/verushash.cpp -o "vh_objs/vh.obj"
          "$CXX" -O2 -std=c++17 -c algo/verushash/vh_clhash_portable.cpp -o "vh_objs/vh_cl.obj"
          "$CXX" -O2 -std=c++17 -c algo/verushash/vh_hash.cpp -o "vh_objs/vh_h.obj"
          "$AR" rcs algo/verushash/verushash_all.lib vh_objs/*.obj
          rm -rf vh_objs

          echo "C modules compiled (Windows MinGW)"

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build ${{ matrix.mode }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.os }}_${{ matrix.arch }}"
          OUT="dist/frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            OUT="${OUT}.exe"
          fi

          mkdir -p dist

          # On Windows, Odin's C backend may need cl.exe / lld-link on PATH.
          # The Odin dist/bin directory ships its own tools.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -d "${ODIN_DIR}/bin" ]]; then
              export PATH="${ODIN_DIR}/bin:${PATH}"
            fi
            ODIN="${ODIN_DIR}/odin.exe"
          else
            ODIN="${ODIN_DIR}/odin"
          fi

          # Collect static lib paths for the linker
          EXTRA_LINKER_FLAGS=""
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            EXTRA_LINKER_FLAGS="-lstdc++ -lpthread -ldl -lm \
              ${PWD}/third_party/randomx/lib/linux-x86_64/librandomx.a \
              ${PWD}/third_party/randomx-keva/lib/linux-x86_64/librandomx-keva.a"
          else
            # Convert all lib paths to Windows format for the C backend linker
            RX_LIB=$(cygpath -w "$PWD/third_party/randomx/lib/windows-x86_64/librandomx.lib" 2>/dev/null)
            KEVA_LIB=$(cygpath -w "$PWD/third_party/randomx-keva/lib/windows-x86_64/librandomx-keva.lib" 2>/dev/null)
            ARG_LIB=$(cygpath -w "$PWD/algo/argon2/argon2_all.lib" 2>/dev/null)
            VER_LIB=$(cygpath -w "$PWD/algo/verushash/verushash_all.lib" 2>/dev/null)
            EXTRA_LINKER_FLAGS="$RX_LIB $KEVA_LIB $ARG_LIB $VER_LIB"
            # MinGW RandomX lib uses POSIX-compatible symbols, no UCRT needed
          fi

          echo "EXTRA_LINKER_FLAGS: $EXTRA_LINKER_FLAGS"
          echo "Lib files:"
          ls -lh ${PWD}/third_party/randomx/lib/windows-x86_64/ 2>/dev/null || true
          ls -lh ${PWD}/third_party/randomx-keva/lib/windows-x86_64/ 2>/dev/null || true
          ls -lh ${PWD}/algo/argon2/argon2_all.lib 2>/dev/null || true
          ls -lh ${PWD}/algo/verushash/verushash_all.lib 2>/dev/null || true

          if [[ "${{ matrix.mode }}" == "debug" ]]; then
            "${ODIN}" build . -target:"$TARGET" -microarch:generic \
              -debug \
              -extra-linker-flags:"$EXTRA_LINKER_FLAGS" \
              -out:"$OUT"
          else
            "${ODIN}" build . -target:"$TARGET" -microarch:generic \
              -o:speed \
              -extra-linker-flags:"$EXTRA_LINKER_FLAGS" \
              -out:"$OUT"
          fi

          echo "Built: $OUT"
          ls -lh "$OUT"

      # ------------------------------------------------------------------
      # Smoke test
      # ------------------------------------------------------------------
      - name: Run smoke test
        shell: bash
        run: |
          OUT="dist/frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            OUT="${OUT}.exe"
          fi
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            echo "Windows artifact built; skipping execution"
          else
            echo "Smoke test: running $OUT"
            timeout 10 "$OUT" 2>&1 || echo "binary exited non-zero or timed out (expected for skeleton)"
            if [[ "${{ matrix.mode }}" == "debug" && -f "errhandler.log" ]]; then
              echo "errhandler.log contents:"
              cat errhandler.log
            fi
          fi

      # ------------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: dist/
          retention-days: 3
