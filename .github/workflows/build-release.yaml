# Release build for the Frostrig Odin project.
#
# Triggers:
#   - git tag matching  rv<major>.<minor>.<patch>[suffix]
#       e.g. rv1.0.0, rv2.3.1, rv1.4.2-beta
#   - manually from the Actions "Run workflow" UI (workflow_dispatch)
#
# Builds both Windows and Linux, release and debug.
# The CPU architecture is taken from the "architecture" workflow input
# (manual trigger) or defaults to amd64 when triggered by a tag.
#
# errhandler.odin is committed to the repo root and is compiled into every
# build.  Its @(init) proc opens "errhandler.log" in the current working
# directory at startup, so panics are written there in both debug and
# release builds.

name: build-release

on:
  push:
    tags:
      # rv<semver> with an optional trailing suffix (e.g. -beta, +rc1)
      - 'rv[0-9]+.[0-9]+.[0-9]+'
      - 'rv[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      architecture:
        description: "CPU architecture to build for"
        type: choice
        required: true
        default: amd64
        options:
          - amd64
          - arm64
          - i386

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.arch }} / ${{ matrix.mode }}
    runs-on: >-
      ${{ matrix.os == 'windows' && 'windows-latest' || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        os: [linux, windows]
        mode: [release, debug]
        # arch is the single architecture selected via workflow_dispatch
        # input, or amd64 when triggered by a tag.
        arch:
          - ${{ github.event.inputs.architecture || 'amd64' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Odin toolchain
      # ------------------------------------------------------------------
      - name: Install Odin
        uses: odin-lang/setup-odin@v1
        with:
          odin-version: "dev-2026-11"

      - name: Install LLVM backend (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang lld

      # ------------------------------------------------------------------
      # errhandler is committed to the repo root (errhandler.odin) and is
      # compiled into every build automatically by `odin build .`.  Its
      # @(init) proc opens "errhandler.log" in the current directory at
      # startup, so any panic traceback is written there.  No CI step is
      # needed to install it.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # Fetch and build RandomX core + Keva variant + Argon2 + VerusHash
      # ------------------------------------------------------------------
      - name: Fetch RandomX source
        run: |
          set -euo pipefail
          curl -fSL --retry 3 -o randomx.tar.gz \
            "https://github.com/tevador/RandomX/archive/refs/tags/v1.2.3.tar.gz"
          tar -xzf randomx.tar.gz
          mv "$(tar -tzf randomx.tar.gz | head -n 1 | cut -d/ -f1)" randomx_src
          echo "RandomX source at randomx_src/"

      - name: Build RandomX static lib
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cmake -S randomx_src -B randomx_src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build randomx_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_src/build/librandomx.a

      - name: Build RandomX-Keva static lib
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cp -r randomx_src randomx_keva_src
          cat > randomx_keva_src/src/configuration.h <<'EOF'
          #pragma once
          #define _KEVACOIN    1
          #define RANDOMX_ARGON_MEMORY       262144
          #define RANDOMX_ARGON_ITERATIONS   3
          #define RANDOMX_ARGON_LANES        1
          #ifdef _KEVACOIN
          #define RANDOMX_ARGON_SALT         "RandomKV\x01"
          #else
          #define RANDOMX_ARGON_SALT         "RandomX\x03"
          #endif
          #define RANDOMX_CACHE_ACCESSES     8
          #define RANDOMX_SUPERSCALAR_LATENCY   170
          #define RANDOMX_DATASET_BASE_SIZE  2147483648
          #define RANDOMX_DATASET_EXTRA_SIZE 33554368
          #define RANDOMX_PROGRAM_SIZE       256
          #define RANDOMX_PROGRAM_ITERATIONS 2048
          #define RANDOMX_PROGRAM_COUNT      8
          #ifdef _KEVACOIN
          #define RANDOMX_SCRATCHPAD_L3      1048576
          #else
          #define RANDOMX_SCRATCHPAD_L3      2097152
          #endif
          #ifdef _KEVACOIN
          #define RANDOMX_SCRATCHPAD_L2      131072
          #else
          #define RANDOMX_SCRATCHPAD_L2      262144
          #endif
          #define RANDOMX_SCRATCHPAD_L1      16384
          #define RANDOMX_JUMP_BITS          8
          #define RANDOMX_JUMP_OFFSET        8
          #define RANDOMX_FREQ_IADD_RS       16
          #define RANDOMX_FREQ_IADD_M         7
          #define RANDOMX_FREQ_ISUB_R        16
          #define RANDOMX_FREQ_ISUB_M         7
          #define RANDOMX_FREQ_IMUL_R        16
          #define RANDOMX_FREQ_IMUL_M         4
          #define RANDOMX_FREQ_IMULH_R        4
          #define RANDOMX_FREQ_IMULH_M        1
          #define RANDOMX_FREQ_ISMULH_R       4
          #define RANDOMX_FREQ_ISMULH_M       1
          #define RANDOMX_FREQ_IMUL_RCP       8
          #define RANDOMX_FREQ_INEG_R         2
          #define RANDOMX_FREQ_IXOR_R        15
          #define RANDOMX_FREQ_IXOR_M         5
          #define RANDOMX_FREQ_IROR_R         8
          #define RANDOMX_FREQ_IROL_R         2
          #define RANDOMX_FREQ_ISWAP_R        4
          #define RANDOMX_FREQ_FSWAP_R        4
          #define RANDOMX_FREQ_FADD_R        16
          #define RANDOMX_FREQ_FADD_M         5
          #define RANDOMX_FREQ_FSUB_R        16
          #define RANDOMX_FREQ_FSUB_M         5
          #define RANDOMX_FREQ_FSCAL_R        6
          #define RANDOMX_FREQ_FMUL_R        32
          #define RANDOMX_FREQ_FDIV_M         4
          #define RANDOMX_FREQ_FSQRT_R        6
          #define RANDOMX_FREQ_CBRANCH       25
          #define RANDOMX_FREQ_CFROUND        1
          #define RANDOMX_FREQ_ISTORE        16
          #define RANDOMX_FREQ_NOP            0
          EOF
          cmake -S randomx_keva_src -B randomx_keva_src/build -DCMAKE_BUILD_TYPE=Release
          cmake --build randomx_keva_src/build --target randomx -j"$(nproc)"
          ls -lh randomx_keva_src/build/librandomx.a

      # ------------------------------------------------------------------
      # Compile C algorithm modules + combined object files
      # ------------------------------------------------------------------
      - name: Compile C modules (RandomX variants + Argon2 + VerusHash)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          CC="gcc"
          CXX="g++"

          # RandomX variant wrappers
          for v in 0 wow 2 c64 v xeq; do
            "$CC" -O2 -fPIC -Ialgo/randomx \
              -c "algo/randomx/${v}.c" \
              -o "algo/randomx/${v}.o"
          done
          # Keva variant wrapper
          "$CC" -O2 -fPIC -Ialgo/keva -Irandomx_keva_src/src \
            -c algo/keva/keva.c -o algo/keva/keva.o

          # Argon2 (combined object via ld -r)
          cd third_party/argon2
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/argon2.c -o /workspace/algo/argon2/argon2.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/core.c  -o /workspace/algo/argon2/core.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/opt.c   -o /workspace/algo/argon2/opt.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/blake2b.c -o /workspace/algo/argon2/blake2b.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/encoding.c -o /workspace/algo/argon2/encoding.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/thread.c -o /workspace/algo/argon2/thread.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/argon2_id.c -o /workspace/algo/argon2/argon2_id.o
          "$CC" -O2 -fPIC -Iinclude -Isrc \
            -c src/argon2d.c -o /workspace/algo/argon2/argon2d.o
          cd /workspace
          ld -r \
            algo/argon2/argon2.o algo/argon2/core.o algo/argon2/opt.o \
            algo/argon2/blake2b.o algo/argon2/encoding.o algo/argon2/thread.o \
            algo/argon2/argon2_id.o algo/argon2/argon2d.o \
            -o algo/argon2/argon2_all.o

          # VerusHash (C++ combined object via ld -r)
          for f in verushash vh_clhash_portable vh_hash haraka_portable; do
            "$CXX" -O2 -fPIC -std=c++11 -Ialgo/verushash \
              -c "algo/verushash/${f}.cpp" \
              -o "algo/verushash/${f}.o"
          done
          ld -r \
            algo/verushash/verushash.o algo/verushash/vh_clhash_portable.o \
            algo/verushash/vh_hash.o algo/verushash/haraka_portable.o \
            -o algo/verushash/verushash_all.o

          echo "All C modules compiled."

      # ------------------------------------------------------------------
      # Build
      # ------------------------------------------------------------------
      - name: Build ${{ matrix.mode }}
        shell: bash
        run: |
          TARGET="${{ matrix.os }}_${{ matrix.arch }}"
          OUT="dist/frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            OUT="${OUT}.exe"
          fi
          mkdir -p dist

          EXTRA_LINKER_FLAGS=""
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            EXTRA_LINKER_FLAGS="-lstdc++ -lpthread -ldl -lm \
              /workspace/randomx_src/build/librandomx.a \
              /workspace/randomx_keva_src/build/librandomx.a"
          fi

          if [[ "${{ matrix.mode }}" == "debug" ]]; then
            odin build . -target:"$TARGET" -microarch:generic \
              -debug \
              -extra-linker-flags:"$EXTRA_LINKER_FLAGS" \
              -out:"$OUT"
          else
            odin build . -target:"$TARGET" -microarch:generic \
              -o:speed \
              -extra-linker-flags:"$EXTRA_LINKER_FLAGS" \
              -out:"$OUT"
          fi

          echo "Built: $OUT"
          ls -lh "$OUT"

      # ------------------------------------------------------------------
      # Smoke test
      # ------------------------------------------------------------------
      - name: Run smoke test
        shell: bash
        run: |
          OUT="dist/frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            OUT="${OUT}.exe"
          fi
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            echo "Windows artifact built; skipping execution on Linux runner"
          else
            echo "Smoke test: running $OUT"
            "$OUT" || echo "binary exited non-zero (expected for skeleton)"
            if [[ "${{ matrix.mode }}" == "debug" && -f "errhandler.log" ]]; then
              echo "errhandler.log contents:"
              cat errhandler.log
            fi
          fi

      # ------------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frostrig-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.mode }}
          path: dist/
          retention-days: 3
